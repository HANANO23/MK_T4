<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 매경테스트 최신 실전 모의고사 (80문항 완벽구현)</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --border-color: #cbd5e1;
      --correct-bg: #dcfce7;
      --correct-border: #22c55e;
      --correct-text: #14532d;
      --wrong-bg: #fee2e2;
      --wrong-border: #ef4444;
      --wrong-text: #7f1d1d;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app-header {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto 16px auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-header h1 {
      font-size: 1.25rem;
      color: var(--text-main);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
    }

    .btn-action:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: #ef4444;
      box-shadow: 0 2px 4px rgba(239, 68, 68, 0.2);
    }

    .btn-secondary {
      background-color: #64748b;
    }

    .btn-warning {
      background-color: #d97706;
      color: white;
    }

    .cbt-container {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      flex: 1;
    }

    @media (max-width: 968px) {
      .cbt-container {
        grid-template-columns: 1fr;
      }
      body {
        padding: 10px;
      }
    }

    .question-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 520px;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
      padding-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .category-badge {
      background-color: var(--primary-light);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .mode-badge {
      background-color: #fef2f2;
      color: #ef4444;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      display: none;
    }

    .progress-text {
      font-size: 0.95rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 16px;
      word-break: keep-all;
      line-height: 1.6;
      color: #1e293b;
      white-space: pre-line;
    }

    .question-box {
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 20px;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.65;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 14px 18px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      background-color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: keep-all;
      color: #334155;
      font-weight: 500;
      line-height: 1.5;
    }

    .option-btn:hover:not(.correct):not(.wrong) {
      background-color: #f8fafc;
      border-color: var(--primary);
      color: var(--primary);
    }

    .option-btn.correct {
      background-color: var(--correct-bg);
      border-color: var(--correct-border);
      color: var(--correct-text);
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: var(--wrong-bg);
      border-color: var(--wrong-border);
      color: var(--wrong-text);
      font-weight: 700;
    }

    .explanation-box {
      margin-top: 15px;
      padding: 20px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 10px;
      white-space: pre-line;
      line-height: 1.7;
      color: #166534;
      font-size: 0.95rem;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
    }

    .navigation-bar {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f1f5f9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      padding: 12px 24px;
      border: 1px solid var(--border-color);
      background-color: #fff;
      color: #334155;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .nav-btn:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #94a3b8;
    }

    .keyboard-tip {
      font-size: 0.82rem;
      color: var(--text-sub);
      text-align: center;
      font-weight: 500;
      width: 100%;
    }

    @media(min-width: 768px) {
      .keyboard-tip { width: auto; }
    }

    .sidebar-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: var(--shadow);
      height: fit-content;
      position: sticky;
      top: 16px;
    }

    .omr-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }

    .omr-header h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .score-summary {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .omr-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(95px, 1fr));
      gap: 8px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .omr-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      background-color: #fff;
      transition: all 0.15s;
    }

    .omr-item:hover {
      border-color: var(--primary);
      background-color: #f8fafc;
    }

    .omr-item.active {
      border-color: var(--primary);
      background-color: var(--primary-light);
      font-weight: 700;
      box-shadow: 0 0 0 1px var(--primary);
    }

    .status-badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .status-none { background: #f1f5f9; color: var(--text-sub); }
    .status-correct { background: var(--correct-bg); color: var(--correct-text); }
    .status-wrong { background: var(--wrong-bg); color: var(--wrong-text); }

    @media (max-width: 768px) {
      .question-card { padding: 18px; }
      .app-header { padding: 12px 16px; }
      .omr-grid { max-height: 350px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>🎯 2026 매경테스트 최신 실전 모의고사 (80문항 완벽구현)</h1>
    <div class="header-btns">
      <button id="wrongOnlyBtn" class="btn-action btn-danger" onclick="filterWrongQuestions()">틀린 문제만 모아보기</button>
      <button id="showAllBtn" class="btn-action btn-secondary" onclick="showAllQuestions()" style="display:none;">전체 문제 보기</button>
      <button class="btn-action" onclick="resetAndShuffle()">리셋 & 순서 섞기</button>
    </div>
  </header>

  <div class="cbt-container">
    <main class="question-card">
      <div>
        <div class="question-header">
          <div class="badge-group">
            <span id="categoryBadge" class="category-badge">[분야] 매경TEST 모의고사</span>
            <span id="modeBadge" class="mode-badge">오답 복습 모드</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button id="reselectBtn" class="btn-action btn-warning" style="display:none; padding: 6px 12px; font-size: 0.8rem;" onclick="reselectAnswer()">🔄 답 다시 선택</button>
            <span class="progress-text"><strong id="currentIndex">1</strong> / <span id="totalIndex">80</span></span>
          </div>
        </div>

        <div id="questionTitle" class="question-title"></div>
        <div id="questionBox" class="question-box" style="display:none;"></div>
        <div id="optionsList" class="options-list"></div>
        <div id="explanationBox" class="explanation-box" style="display: none;"></div>
      </div>

      <div class="navigation-bar">
        <button id="prevBtn" class="nav-btn" onclick="prevQuestion()">◀ 이전</button>
        <span class="keyboard-tip">💡 정답 보기를 <strong>더블 클릭(더블 탭)</strong> 시 다음 문제로 바로 넘어갑니다</span>
        <button id="nextBtn" class="nav-btn" onclick="nextQuestion()">다음 ▶</button>
      </div>
    </main>

    <aside class="sidebar-card">
      <div class="omr-header">
        <h3>OMR 답안지</h3>
        <span id="scoreSummary" class="score-summary">맞힘: 0 / 80</span>
      </div>
      <div id="omrGrid" class="omr-grid"></div>
    </aside>
  </div>

  <script>
    const originalQuestions = [
      {
        id: 1,
        category: "[경영] 재무제표",
        question: "01. 다음 중 당기순이익 중에서 현금으로 지급된 배당금 총액의 비율을 뜻하는 재무지표는?",
        options: ["① 배당성향", "② 사내유보율", "③ 시가배당률", "④ 액면배당률", "⑤ 배당수익률"],
        answer: 1,
        explanation: "[정답 해설]\n• ① 배당성향 (정답): 당기순이익 중 현금배당으로 지급된 총액의 비율을 의미합니다.\n\n[오답 보기 해설]\n• ② 사내유보율: 당기순이익 중 사내에 유보(재투자 등)시키는 비율입니다.\n• ③ 시가배당률: 주가에 대한 1주당 배당금의 비율입니다.\n• ④ 액면배당률: 액면가에 대한 1주당 배당금의 비율입니다.\n• ⑤ 배당수익률: 현재 주가 대비 배당금이 차지하는 비율입니다."
      },
      {
        id: 2,
        category: "[경영] 조직구조",
        question: "02. 다음 중 기업에서는 집중해야 하는 핵심역량만 보유하고 나머지 요소들은 아웃소싱을 통해 운영하는 조직구조는?",
        options: ["① 기능 조직", "② 기계적 조직", "③ 사업부 조직", "④ 네트워크 조직", "⑤ 매트릭스 조직"],
        answer: 4,
        explanation: "[정답 해설]\n• ④ 네트워크 조직 (정답): 핵심 역량만 자체 보유하고 나머지는 외부 네트워크와 아웃소싱으로 연결하는 조직 형태입니다.\n\n[오답 보기 해설]\n• ① 기능 조직: 업무의 전문 기능별로 부서를 편성하는 전통적 구조입니다.\n• ② 기계적 조직: 공식화와 집권화가 높은 관료제적 성격의 조직입니다.\n• ③ 사업부 조직: 지역, 제품, 고객 등 사업 단위별로 독립된 조직을 구성하는 형태입니다.\n• ⑤ 매트릭스 조직: 기능 조직과 사업부 조직을 결합하여 이중 보고 체계를 갖춘 구조입니다."
      },
      {
        id: 3,
        category: "[경영] 자본구조",
        question: "03. 다음 중 기업이 주주에게 일정한 보상을 주지 않고 주식을 소각해 자본잠식에서 벗어나는 방법은?",
        options: ["① 유상증자", "② 무상증자", "③ 유상감자", "④ 무상감자", "⑤ 주식분할"],
        answer: 4,
        explanation: "[정답 해설]\n• ④ 무상감자 (정답): 결손금을 메우기 위해 주주에게 보상 없이 주식 수를 강제로 줄이는 감자 방식입니다.\n\n[오답 보기 해설]\n• ① 유상증자: 대금을 받고 새로운 주식을 발행하여 자본금을 늘리는 방식입니다.\n• ② 무상증자: 잉여금을 자본전입하여 주주에게 대가 없이 주식을 나누어주는 방식입니다.\n• ③ 유상감자: 주주에게 보상을 지급하고 주식 수를 줄이는 방식입니다.\n• ⑤ 주식분할: 자본금 변동 없이 기존 주식을 쪼개어 유통 주식 수를 늘리는 것입니다."
      },
      {
        id: 4,
        category: "[경영] 증권시장",
        question: "04. 다음 중 기업규모, 매출액 등에서 우량 종목이 많이 상장된 순으로 증권시장을 올바르게 나열한 것은?",
        options: [
          "① 코스닥시장 > 유가증권시장 > 코넥스",
          "② 코스닥시장 > 코넥스 > 유가증권시장",
          "③ 유가증권시장 > 코스닥시장 > 코넥스",
          "④ 유가증권시장 > 코넥스 > 코스닥시장",
          "⑤ 코넥스 > 유가증권시장 > 코스닥시장"
        ],
        answer: 3,
        explanation: "[정답 해설]\n• ③ 유가증권시장 > 코스닥시장 > 코넥스 (정답): 대기업 중심의 유가증권시장(KOSPI), 중견·벤처기업 중심의 코스닥, 초기 중소기업 중심의 코넥스 순입니다.\n\n[오답 보기 해설]\n• ①, ②, ④, ⑤: 규모와 요건 순서가 잘못 나열되었습니다."
      },
      {
        id: 5,
        category: "[경영] 리더십",
        question: "05. 리더십 관리격자도모형에서 사람에는 높은 관심을 보이지만 과업에는 낮은 관심을 보이는 리더의 유형으로 가장 올바른 것은?",
        options: ["① 팀형", "② 중도형", "③ 과업형", "④ 무관심형", "⑤ 컨트리클럽형"],
        answer: 5,
        explanation: "[정답 해설]\n• ⑤ 컨트리클럽형 (정답): (1,9) 유형으로 사람에 대한 관심은 극대화하고 과업 생산성은 경시하는 유형입니다.\n\n[오답 보기 해설]\n• ① 팀형: 사람과 과업 모두에 대한 관심이 최고 수준인 (9,9) 유형입니다.\n• ② 중도형: 사람과 과업 모두 중간 수준인 (5,5) 유형입니다.\n• ③ 과업형: 과업에만 극도로 치중하고 사람은 무시하는 (9,1) 유형입니다.\n• ④ 무관심형: 사람과 과업 모두 관심이 없는 (1,1) 유형입니다."
      },
      {
        id: 6,
        category: "[경영] 이사회",
        question: "06. 다음 중 주식회사의 대표적인 기관인 이사회에 대한 올바른 설명으로 가장 거리가 먼 것은?",
        options: [
          "① 기업의 최대주주를 선임할 수 있다.",
          "② 자금 조달 방법에 대한 의사결정을 한다.",
          "③ 경영진의 업무 진행에 대한 감독을 한다.",
          "④ 주총에서 권한을 위임받은 상설 기관이다.",
          "⑤ 일정 규모 이상의 기업은 사외이사를 둔다."
        ],
        answer: 1,
        explanation: "[정답 해설]\n• ① 기업의 최대주주를 선임할 수 있다 (정답-거리가 먼 것): 최대주주는 주식 소유 비율에 따라 자연스럽게 결정되는 지위이므로 이사회가 선임할 수 없습니다.\n\n[오답 보기 해설]\n• ②, ③, ④, ⑤: 이사회는 회사의 중요 경영 의사결정, 업무 집행 감독, 주총 위임 사항 처리 및 사외이사 선임 요건 등을 담당합니다."
      },
      {
        id: 7,

        answer: 3,
        explanation: "[정답 해설]\n• ③ 국민연금 (정답): 재정 안정화를 위해 자동조정장치 도입 논란이 벌어지고 있는 공적 연금 제도는 국민연금입니다.\n\n[오답 보기 해설]\n• ①, ②, ④, ⑤: 자동조정장치 논의가 중심이 되는 해당 기사의 대상 제도가 아닙니다."

        explanation: "[정답 해설]\n• ③ 확장실업률 (정답): 고용보조지표 3호인 확장실업률(체감실업률)에 대한 설명입니다.\n\n[오답 보기 해설]\n• ① 구인율: 미충원 인원 비율입니다.\n• ② 자연실업: 구조적·마찰적 실업률 합입니다.\n• ④ 청년실업률: 청년층 공식 실업률입니다.\n• ⑤ 경제활동참가율: 생산가능인구 대비 경제활동인구 비율입니다."

      {
        id: 78,
        category: "[금융] 리스크관리",
        question: "78. 아래에서 설명하는 이것은?",
        boxContent: "이것은 금융기관의 자본 건전성과 위험 대응 능력을 점검하기 위한 시나리오 기반 분석 기법이다. 경기침체, 금리 급변, 금융시장 충격 등 극단적인 상황을 가정해 손실 규모와 자본 적정성을 평가하여 금융시스템 전반의 취약 요인을 사전에 파악하고 대비할 목적으로 갖고 있다.",
        options: ["① VaR", "② 강건성 검증", "③ 델파이 기법", "④ 블랙박스 테스트", "⑤ 스트레스 테스트"],
        answer: 5,
        explanation: "[정답 해설]\n• ⑤ 스트레스 테스트 (정답): 극단적 경제 위기 상황을 가정하여 금융기관의 건전성을 평가하는 스트레스 테스트입니다.\n\n[오답 보기 해설]\n• ① VaR: 최대 예상 손실 금액 측정 지표입니다.\n• ② 강건성 검증: 시스템 안정성 평가 방식입니다.\n• ③ 델파이 기법: 전문가 예측 기법입니다.\n• ④ 블랙박스 테스트: 소프트웨어 테스트 기법입니다."
      },
      {
        id: 79,
        category: "[사회] 교육제도",
        question: "79. 아래에서 설명하는 이것은?",

        options: ["① 평생교육", "② 현장실습", "③ 고교학점제", "④ 학사학위 연계과정", "⑤ 고교-대학 연계 심화과정"],
        answer: 3,
        explanation: "[정답 해설]\n• ③ 고교학점제 (정답): 학생이 진로에 따라 과목을 선택하고 이수 기준에 도달하면 학점을 취득하는 제도입니다.\n\n[오답 보기 해설]\n• ① 평생교육: 성인 대상 교육입니다.\n• ② 현장실습: 직무 실무 실습입니다.\n• ④, ⑤ 대학 연계 및 학위 과정입니다."
      },
      {
        id: 80,
        category: "[경제] 경제발전",
        question: "80. 아래에서 설명하는 이것은?",
        boxContent: "이것은 개발도상국에서 농촌의 저렴한 인력으로 급속한 산업발전을 이루지만, 농촌의 노동력이 도시로 이동하면서 노동력이 고갈되는 시점에 임금이 급등하고 성장이 둔화되는 현상을 뜻한다. 2010년대에 중국이, 그리고 2020년대 들어서는 베트남에서 이 현상이 나타나는 것으로 분석되고 있다.",
        options: ["① 캐즘", "② 턴어라운드", "③ 창조적 파괴", "④ 루이스 전환점", "⑤ 양질 전환의 법칙"],
        answer: 4,
        explanation: "[정답 해설]\n• ④ 루이스 전환점 (정답): 잉여 노동력이 고갈되어 임금이 급등하고 경제 성장 체질이 바뀌는 변곡점인 루이스 전환점(Lewis turning point)입니다.\n\n[오답 보기 해설]\n• ① 캐즘: 신기술 수용의 일시적 정체기입니다.\n• ② 턴어라운드: 실적 호전입니다.\n• ③ 창조적 파괴: 혁신에 의한 경제 체제 갱신입니다.\n• ⑤ 양질 전환의 법칙: 철학적 발전 법칙입니다."
      }
    ];

    let currentQuestions = [...originalQuestions];
    let currentIndex = 0;
    let userAnswers = {};
    let isWrongOnlyMode = false;
    let clickTimers = {};

    function initApp() {
      document.getElementById('totalIndex').innerText = currentQuestions.length;
      renderQuestion();
      renderOMR();
      updateScoreSummary();
    }

    function renderQuestion() {
      if (!currentQuestions || currentQuestions.length === 0) return;
      const q = currentQuestions[currentIndex];

      document.getElementById('categoryBadge').innerText = q.category;
      document.getElementById('currentIndex').innerText = currentIndex + 1;
      document.getElementById('totalIndex').innerText = currentQuestions.length;
      document.getElementById('questionTitle').innerHTML = q.question;

      const qBox = document.getElementById('questionBox');
      if (q.boxContent) {
        qBox.style.display = 'block';
        qBox.innerHTML = q.boxContent;
      } else {
        qBox.style.display = 'none';
        qBox.innerHTML = '';
      }

      const optionsList = document.getElementById('optionsList');
      optionsList.innerHTML = '';

      const selectedOpt = userAnswers[q.id];
      const reselectBtn = document.getElementById('reselectBtn');

      q.options.forEach((optText, idx) => {
        const optNum = idx + 1;
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = optText;

        if (selectedOpt !== undefined) {
          if (optNum === q.answer) {
            btn.classList.add('correct');
          } else if (optNum === selectedOpt) {
            btn.classList.add('wrong');
          }
        }

        btn.onclick = (e) => handleOptionClick(q.id, optNum, e);
        btn.ontouchend = (e) => {
          e.preventDefault();
          handleOptionClick(q.id, optNum, e);
        };

        optionsList.appendChild(btn);
      });

      if (selectedOpt === undefined) {
        reselectBtn.style.display = 'none';
      } else {
        reselectBtn.style.display = 'inline-block';
      }

      const expBox = document.getElementById('explanationBox');
      if (selectedOpt !== undefined) {
        expBox.style.display = 'block';
        expBox.innerHTML = q.explanation.replace(/\n/g, '<br>');
      } else {
        expBox.style.display = 'none';
        expBox.innerHTML = '';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === currentQuestions.length - 1);

      updateOMRActive();
    }

    function handleOptionClick(qId, optNum, event) {
      const now = new Date().getTime();
      const currentAns = userAnswers[qId];

      if (currentAns === undefined) {
        userAnswers[qId] = optNum;
        renderQuestion();
        renderOMR();
        updateScoreSummary();
        clickTimers[qId] = { time: now, opt: optNum };
      } else {
        const lastClick = clickTimers[qId];
        if (lastClick && (lastClick.opt === optNum || (now - lastClick.time < 600))) {
          nextQuestion();
        } else {
          clickTimers[qId] = { time: now, opt: optNum };
        }
      }
    }

    function reselectAnswer() {
      const q = currentQuestions[currentIndex];
      if (confirm(`Q${q.id}번의 선택한 답을 초기화하고 다시 풀시겠습니까?`)) {
        delete userAnswers[q.id];
        renderQuestion();
        renderOMR();
        updateScoreSummary();
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentIndex < currentQuestions.length - 1) {
        currentIndex++;
        renderQuestion();
      }
    }

    function renderOMR() {
      const omrGrid = document.getElementById('omrGrid');
      omrGrid.innerHTML = '';

      currentQuestions.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'omr-item';
        if (idx === currentIndex) item.classList.add('active');

        const userAns = userAnswers[q.id];
        let statusText = '-';
        let statusClass = 'status-none';

        if (userAns !== undefined) {
          if (userAns === q.answer) {
            statusText = '정답';
            statusClass = 'status-correct';
          } else {
            statusText = '오답';
            statusClass = 'status-wrong';
          }
        }

        item.innerHTML = `
          <span>Q${String(q.id).padStart(2, '0')}</span>
          <span class="status-badge ${statusClass}">${statusText}</span>
        `;

        item.onclick = () => {
          currentIndex = idx;
          renderQuestion();
        };

        omrGrid.appendChild(item);
      });
    }

    function updateOMRActive() {
      const items = document.querySelectorAll('.omr-item');
      items.forEach((item, idx) => {
        if (idx === currentIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }

    function updateScoreSummary() {
      let correctCount = 0;
      originalQuestions.forEach(q => {
        if (userAnswers[q.id] !== undefined) {
          if (userAnswers[q.id] === q.answer) correctCount++;
        }
      });
      document.getElementById('scoreSummary').innerText = `맞힘: ${correctCount} / ${originalQuestions.length}`;
    }

    function resetAndShuffle() {
      if (confirm('모든 답안을 초기화하고 문제 순서를 섞으시겠습니까?')) {
        isWrongOnlyMode = false;
        userAnswers = {};
        clickTimers = {};
        currentQuestions = [...originalQuestions].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        
        document.getElementById('modeBadge').style.display = 'none';
        document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
        document.getElementById('showAllBtn').style.display = 'none';
        
        initApp();
      }
    }

    function filterWrongQuestions() {
      const wrongList = originalQuestions.filter(q => userAnswers[q.id] !== undefined && userAnswers[q.id] !== q.answer);

      if (wrongList.length === 0) {
        alert('틀린 문제가 없습니다! (풀지 않았거나 모두 정답인 상태입니다)');
        return;
      }

      isWrongOnlyMode = true;
      currentQuestions = wrongList;
      currentIndex = 0;

      document.getElementById('modeBadge').innerText = `오답 복습 (${wrongList.length}개)`;
      document.getElementById('modeBadge').style.display = 'inline-block';
      document.getElementById('wrongOnlyBtn').style.display = 'none';
      document.getElementById('showAllBtn').style.display = 'inline-block';

      initApp();
    }

    function showAllQuestions() {
      isWrongOnlyMode = false;
      currentQuestions = [...originalQuestions];
      currentIndex = 0;

      document.getElementById('modeBadge').style.display = 'none';
      document.getElementById('wrongOnlyBtn').style.display = 'inline-block';
      document.getElementById('showAllBtn').style.display = 'none';

      initApp();
    }

    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        nextQuestion();
      }
    });

    window.onload = initApp;
  </script>
